# Локальный стенд (make lab-up): «ВМ» — контейнеры p318-app и p318-monitoring
# (Ubuntu 24.04 + systemd + sshd) в docker-сети p318-lab 10.38.0.0/24, см. lab/compose.yaml.
# private_ip — адрес во «внутренней сети» между ВМ: по нему ходят Prometheus и Promtail.

[app]
app-1 ansible_host=p318-app private_ip=10.38.0.10

[monitoring]
monitoring-1 ansible_host=p318-monitoring private_ip=10.38.0.20
