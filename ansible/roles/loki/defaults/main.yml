---
# Loki (single binary) в Docker на ВМ мониторинга; данные — в именованном томе
loki_image: grafana/loki:3.7.9
loki_container_name: loki
loki_root: /opt/loki
loki_data_volume: loki-data
loki_port: 3100
# Адрес публикации порта на ВМ: Promtail с ВМ приложения ходит сюда по внутренней сети
loki_bind_address: 0.0.0.0
loki_retention_period: 168h
# Предел размера gRPC-сообщения внутри Loki (ответы с длинными стектрейсами), байт
loki_grpc_max_msg_size: 67108864
loki_docker_network: "{{ monitoring_network | default('monitoring') }}"
loki_docker_network_subnet: "{{ monitoring_network_subnet | default('172.30.0.0/24') }}"
