---
# Межсетевой экран ufw: всё входящее запрещено, кроме перечисленного.
# false — не трогать ufw (например, если ВМ закрыта только группой безопасности)
firewall_enabled: true
# Порты, открытые всем
firewall_allowed_tcp_ports:
  - 22
# Порты, открытые только с перечисленных адресов или подсетей:
#   - port: 9100
#     from: [10.10.0.20]
firewall_restricted_tcp_ports: []
