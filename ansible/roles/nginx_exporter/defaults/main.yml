---
# nginx-prometheus-exporter: бинарник с GitHub + systemd-юнит с автоперезапуском.
# Версия зафиксирована здесь: обновлять вместе с nginx, чтобы не менялся набор метрик.
nginx_exporter_version: 1.5.3
nginx_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] | default('amd64') }}"
nginx_exporter_release: "nginx-prometheus-exporter_{{ nginx_exporter_version }}_linux_{{ nginx_exporter_arch }}"
nginx_exporter_download_url: "https://github.com/nginx/nginx-prometheus-exporter/releases/download/v{{ nginx_exporter_version }}"
nginx_exporter_binary: /usr/local/bin/nginx-prometheus-exporter
nginx_exporter_user: nginx-exporter
nginx_exporter_port: 9113
nginx_exporter_listen_address: ":{{ nginx_exporter_port }}"
# Откуда читать stub_status (location на management-порту nginx, доступен с 127.0.0.1)
nginx_exporter_scrape_uri: http://127.0.0.1:9090/stub_status
