---
- name: Создать системного пользователя node_exporter
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Узнать установленную версию node_exporter
  ansible.builtin.command: "{{ node_exporter_binary }} --version"
  register: node_exporter_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Скачивание и распаковка — только если нужной версии ещё нет (повторный прогон ничего не меняет).
# В режиме --check ничего не скачивается — шаг пропускается.
- name: Установить node_exporter {{ node_exporter_version }}
  when:
    - ('version ' ~ node_exporter_version ~ ' ') not in (node_exporter_installed.stdout | default('')) ~ (node_exporter_installed.stderr | default(''))
    - not ansible_check_mode
  block:
    - name: Скачать архив node_exporter (с проверкой sha256)
      ansible.builtin.get_url:
        url: "{{ node_exporter_download_url }}/{{ node_exporter_release }}.tar.gz"
        dest: "/tmp/{{ node_exporter_release }}.tar.gz"
        checksum: "sha256:{{ node_exporter_download_url }}/sha256sums.txt"
        mode: "0644"
      register: node_exporter_download
      until: node_exporter_download is succeeded
      retries: 3
      delay: 5

    - name: Распаковать архив node_exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_release }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Установить бинарник node_exporter
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_release }}/node_exporter"
        dest: "{{ node_exporter_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: restart node_exporter

- name: Разложить systemd-юнит node_exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Запустить node_exporter и включить автозапуск
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or node_exporter_installed.rc == 0
