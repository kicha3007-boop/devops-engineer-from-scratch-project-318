---
# Prometheus Node Exporter: бинарник с GitHub + systemd-юнит с автоперезапуском
node_exporter_version: 1.12.1
node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] | default('amd64') }}"
node_exporter_release: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
node_exporter_binary: /usr/local/bin/node_exporter
node_exporter_user: node-exporter
node_exporter_port: 9100
node_exporter_listen_address: "0.0.0.0:{{ node_exporter_port }}"

# Состояние системных сервисов (метрика node_systemd_unit_state) — только нужные юниты
node_exporter_systemd_units:
  - docker
  - containerd
  - nginx
  - ssh
  - ufw
  - node_exporter
  - nginx_exporter
# Не считать псевдо-файловые системы и точки монтирования контейнеров
node_exporter_fs_mount_points_exclude: "^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containerd/.+)($|/)"
node_exporter_extra_args: []
