---
- name: Создать каталог конфигурации Promtail
  ansible.builtin.file:
    path: "{{ promtail_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Разложить конфигурацию Promtail
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ promtail_root }}/config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart promtail

# В режиме --check на чистом сервере Docker ещё не установлен — сравнивать не с чем
- name: Запустить Promtail
  when: not ansible_check_mode or 'docker-ce' in ansible_facts.packages
  block:
    - name: Создать том для позиций чтения логов
      community.docker.docker_volume:
        name: "{{ promtail_positions_volume }}"

    - name: Запустить контейнер Promtail
      community.docker.docker_container:
        name: "{{ promtail_container_name }}"
        image: "{{ promtail_image }}"
        restart_policy: unless-stopped
        command:
          - -config.file=/etc/promtail/config.yml
        volumes:
          - "{{ promtail_root }}:/etc/promtail:ro"
          - "{{ promtail_positions_volume }}:/var/lib/promtail"
          - /var/log/nginx:/var/log/nginx:ro
          # Список контейнеров и их stdout — через Docker API (только чтение)
          - /var/run/docker.sock:/var/run/docker.sock:ro
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"
