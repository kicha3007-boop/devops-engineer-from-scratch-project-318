[defaults]
# По умолчанию — настоящие ВМ; локальный стенд: -i inventories/lab/hosts.ini (make lab-deploy)
inventory = inventories/production/hosts.ini
# Свои роли — в ansible/roles; сторонние (requirements.yml) ставятся в ~/.ansible/roles
roles_path = roles:~/.ansible/roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
host_key_checking = True
forks = 10

[ssh_connection]
pipelining = True
