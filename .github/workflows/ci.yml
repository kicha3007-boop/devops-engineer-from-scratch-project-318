name: CI

# Тесты -> сборка образа -> публикация в GitHub Container Registry.
# Публикация только при push в main; на pull request образ лишь собирается.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Тесты и линтер приложения
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - name: Линтер (spotless)
        run: make app-lint
      - name: Тесты
        run: make app-test

  infra:
    name: Линтер инфраструктуры (Ansible, Terraform, дашборды)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Установить Ansible
        run: pip install "ansible-core==2.21.*" "ansible-lint==26.*"
      - name: Установить роли и коллекции
        run: |
          ansible-galaxy role install -r requirements.yml -p ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
      - name: Синтаксис плейбуков
        working-directory: ansible
        run: |
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check -i inventories/lab/hosts.ini "$p"
          done
      - name: JSON дашбордов Grafana
        run: for f in ansible/roles/grafana/files/dashboards/*.json; do python -m json.tool "$f" > /dev/null; done
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  image:
    name: Сборка и публикация образа
    needs: [test, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Вход в GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги: latest — последняя сборка main; полный git sha — конкретная сборка (для отката)
      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_REGISTRY=docker.io/library
          cache-from: type=gha
          cache-to: type=gha,mode=max
